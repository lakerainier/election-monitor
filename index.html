<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Election 2026 Results Desk</title>
<meta name="description" content="Live results and projections for the 2026 midterms: Senate, House and governors nationwide, with a dedicated Seattle and Washington desk.">
<meta property="og:title" content="Election 2026 Results Desk">
<meta property="og:description" content="Live national and Seattle results and projections for Nov. 3, 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500..800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}

/* Layout: sticky masthead + status rail, then a scannable race board (summary first), race detail and map as hash views. */
:root{
  --ground:#F4F5F6; --surface:#FFFFFF; --sunk:#E9ECEE; --ink:#121417; --muted:#5B6470; --rule:#D5D9DE;
  --a:#236D8E; --a-soft:#CFE3EC; --b:#B4621F; --b-soft:#F2DCC7;
  --on-strong:#FFFFFF; --dem:#1F5FAE; --dem-lt:#9FBDE6; --rep:#C23B32; --rep-lt:#EEA9A2; --ind:#6E57A8; --ind-lt:#C2B5E2; --tu:#C9CDD2; --nomap:#E4E6E9; --water:#CFE0E8; --land:#F7F8F6; --land-out:#DDE2DF; --road:#9AA6AC; --live:#C8233A; --ok:#2E7D4F; --warn:#9A6B00; --sim:#6B4FA0; --sim-soft:#E7E0F3;
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif; --f-num:"Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --s1:.75rem; --s2:.875rem; --s3:1rem; --s4:1.25rem; --s5:1.6rem; --s6:2.4rem;
  --radius:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1215; --surface:#171B20; --sunk:#20262D; --ink:#E8EBEE; --muted:#9AA3AD; --rule:#2E353D;
  --a:#6DB4D6; --a-soft:#1D3E4E; --b:#E79A5C; --b-soft:#4A3020;
  --on-strong:#0E1519; --dem:#6EA6E8; --dem-lt:#2D4B73; --rep:#F07A70; --rep-lt:#6E3330; --ind:#B4A0E8; --ind-lt:#4A3D6E; --tu:#3D454E; --nomap:#262C33; --water:#0B2230; --land:#1E2B33; --land-out:#141E24; --road:#55666F; --live:#FF5A6E; --ok:#5BC48A; --warn:#E2B44A; --sim:#B49BE6; --sim-soft:#2E2445; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0F1215; --surface:#171B20; --sunk:#20262D; --ink:#E8EBEE; --muted:#9AA3AD; --rule:#2E353D;
  --a:#6DB4D6; --a-soft:#1D3E4E; --b:#E79A5C; --b-soft:#4A3020;
  --on-strong:#0E1519; --dem:#6EA6E8; --dem-lt:#2D4B73; --rep:#F07A70; --rep-lt:#6E3330; --ind:#B4A0E8; --ind-lt:#4A3D6E; --tu:#3D454E; --nomap:#262C33; --water:#0B2230; --land:#1E2B33; --land-out:#141E24; --road:#55666F; --live:#FF5A6E; --ok:#5BC48A; --warn:#E2B44A; --sim:#B49BE6; --sim-soft:#2E2445; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-data);font-size:var(--s1);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ink);color:var(--ground)}
.mast .wrap{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding-block:.6rem}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.005em;text-decoration:none;line-height:1.1}
.brand small{display:block;font-family:var(--f-data);font-stretch:100%;font-weight:400;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.nav{display:flex;gap:.25rem;flex-wrap:wrap;margin-left:auto}
.nav a{font-family:var(--f-data);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:.4rem .6rem;border-radius:4px;opacity:.8}
.nav a[aria-current="page"]{background:var(--ground);color:var(--ink);opacity:1}
.nav a:hover{opacity:1}
.livechip{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--f-data);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}*{transition:none!important}}

/* status rail */
.rail{border-bottom:1px solid var(--rule);background:var(--surface)}
.rail .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;padding-block:0}
.stat{padding:.75rem .9rem;border-left:1px solid var(--rule);min-width:0}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font-family:var(--f-num);font-size:1.45rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
@media (max-width:640px){.stat{border-left:0;padding-left:0;border-top:1px solid var(--rule)}.stat:first-child{border-top:0}}

.simbar{background:var(--sim-soft);color:var(--sim);border-bottom:1px solid var(--sim)}
.simbar .wrap{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;padding-block:.5rem;font-size:.85rem}
.simbar b{font-family:var(--f-data);letter-spacing:.06em;text-transform:uppercase;font-size:.75rem}

main{padding-block:1.5rem 4rem}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(1.75rem,3.6vw,2.5rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:700}
h3{font-family:var(--f-body);font-size:1rem;font-weight:700}
p{margin:0}
.lede{max-width:66ch;color:var(--muted);margin-top:.5rem}

.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--rule);background:var(--surface);border-radius:4px;padding:.45rem .8rem;cursor:pointer;font-size:.85rem;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.sim{border-color:var(--sim);color:var(--sim)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* updates + timeline */
.top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.5rem;margin:1.25rem 0 2rem}
@media (max-width:860px){.top{grid-template-columns:minmax(0,1fr)}}
.timeline{list-style:none;margin:.75rem 0 0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:7.5rem 1fr;gap:.75rem;padding:.45rem 0;border-top:1px solid var(--rule);font-size:.88rem}
.timeline li.now{font-weight:700}
.timeline li.done{color:var(--muted)}
.timeline time{font-family:var(--f-data);font-size:.78rem}
.feed{display:grid;gap:.75rem;margin-top:.75rem}
.post{border-left:3px solid var(--live);padding:.1rem 0 .1rem .75rem}
.post time{font-family:var(--f-data);font-size:.75rem;color:var(--muted)}
.post h3{margin:.1rem 0 .2rem}

/* race board */
.group{margin-top:2rem}
.group > header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;border-bottom:2px solid var(--ink);padding-bottom:.35rem;margin-bottom:.9rem;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.9rem}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:.9rem 1rem;display:grid;gap:.6rem;text-decoration:none;min-width:0}
.card:hover{border-color:var(--ink)}
.card .head{display:flex;justify-content:space-between;gap:.75rem;align-items:flex-start}
.card .head h3{min-width:0}
.opt{display:grid;grid-template-columns:1fr auto;gap:.1rem .5rem;align-items:baseline}
.opt .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.opt .nm small{font-weight:400;color:var(--muted);font-size:.78rem;margin-left:.3rem}
.opt .pc{font-family:var(--f-data);font-weight:600;font-variant-numeric:tabular-nums}
.opt.lead .nm::before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-right:.35rem;background:currentColor;vertical-align:.1em}
.opt.ka{color:var(--a)} .opt.kb{color:var(--b)}
.opt .nm,.opt .pc{color:var(--ink)}
.bar{position:relative;height:12px;border-radius:2px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ba{background:var(--a)} .bar .bb{background:var(--b)}
.bar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.bar.prior .ba{background:repeating-linear-gradient(135deg,var(--a) 0 4px,var(--a-soft) 4px 7px)}
.bar.prior .bb{background:repeating-linear-gradient(135deg,var(--b) 0 4px,var(--b-soft) 4px 7px)}
.foot{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--f-data);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:.1rem .35rem;white-space:nowrap}
.chip.prior{color:var(--muted)} .chip.early{color:var(--muted)} .chip.close{color:var(--warn)} .chip.lean{color:var(--a)}
.chip.proj{color:var(--ok)} .chip.called{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.chip.uncont{color:var(--muted)}

/* race detail */
.crumbs{font-family:var(--f-data);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.5rem;margin-top:1.25rem}
@media (max-width:900px){.detail{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:1rem 1.1rem;min-width:0}
.panel + .panel{margin-top:1rem}
.big{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:.5rem 0 1rem}
.big .side{min-width:0}
.big .side b{font-family:var(--f-num);font-size:clamp(2rem,5.5vw,3rem);font-weight:700;letter-spacing:-.02em;line-height:1;display:block;font-variant-numeric:tabular-nums}
.big .side.sa b{color:var(--a)} .big .side.sb b{color:var(--b)}
.big .side.sb{text-align:right}
.big .side .who{font-weight:700;font-size:1.05rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin-top:.75rem}
.kv div{border-top:1px solid var(--rule);padding-top:.4rem;min-width:0}
.kv dt{font-size:.75rem;color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-data);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums}
dl{margin:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-data);font-size:11px}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .half{stroke:var(--ink);stroke-dasharray:3 3;opacity:.6}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:.4rem}
.legend i{display:inline-block;width:12px;height:8px;margin-right:.3rem;vertical-align:middle}
.note{font-size:.85rem;color:var(--muted);max-width:68ch}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-family:var(--f-data);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.5rem;align-items:start}
@media (max-width:820px){.mapwrap{grid-template-columns:minmax(0,1fr)}}
.scale{display:flex;height:10px;border-radius:2px;overflow:hidden;margin-top:.5rem}
.scale i{flex:1}

/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1.25rem;align-items:start;margin-top:1rem}
.mapgrid > div > .panel + .panel{margin-top:1rem}
@media (max-width:860px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.mappanel{padding:.6rem}
.mapbox{position:relative;border-radius:4px;overflow:hidden;touch-action:pan-y pinch-zoom}
.mapbox.small{touch-action:auto}
.smap{display:block;width:100%;height:auto;cursor:grab}
.mapbox.small .smap{cursor:default}
.smap .water{fill:var(--water)}
.smap .around{fill:var(--land-out)}
.smap .cityland{fill:var(--land)}
.smap path.p{stroke:var(--surface);stroke-width:.4;stroke-opacity:.7}
.smap path.p.off{fill-opacity:.55}
.smap path.p:hover{stroke:var(--ink);stroke-width:1.5}
.smap .cdfill{stroke:none}
.smap .cd{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-opacity:.75;pointer-events:none}
.smap .cd.hi{stroke-width:3.2;stroke-opacity:1}
.smap .rd{fill:none;stroke:var(--road);stroke-width:1.4;pointer-events:none}
.smap .hood{font-family:var(--f-data);font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none;letter-spacing:.02em}
.smap .cdl{pointer-events:none}
.smap .cdl circle{fill:var(--ink)}
.smap .cdl text{fill:var(--surface);font-family:var(--f-data);font-size:12px;font-weight:600}
.smap .cdl text.sub{fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;font-size:11px}
.mapbox.small .smap .cdl circle{r:8}
.zoombtns{position:absolute;top:.5rem;right:.5rem;display:flex;flex-direction:column;gap:.3rem}
.zoombtns .btn{justify-content:center;min-width:2.2rem;padding:.3rem .5rem;font-size:.85rem}
.tip{position:absolute;z-index:3;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:.45rem .6rem;font-size:.82rem;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.15);min-width:160px}
.tip div{display:flex;justify-content:space-between;gap:1rem}
.maplegend{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--muted);margin-top:.6rem}
.maplegend .scale{flex:1;margin:0;max-width:260px}

/* national */
.ticker{background:var(--surface);border-bottom:1px solid var(--rule)}
.ticker .wrap{display:flex;gap:0;flex-wrap:wrap;padding-block:0}
.tk{display:flex;align-items:baseline;gap:.5rem;padding:.55rem 1rem .55rem 0;margin-right:1rem;border-right:1px solid var(--rule);text-decoration:none;font-size:.85rem;white-space:nowrap}
.tk:last-child{border-right:0}
.tk-l{font-weight:700}
.tk-d{color:var(--dem);font-weight:600}.tk-r{color:var(--rep);font-weight:600}
.natgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:1.75rem;align-items:start}
@media (max-width:1020px){.natgrid{grid-template-columns:minmax(0,1fr)}}
.natmain{display:grid;gap:1.25rem;min-width:0}
.natmain > h1 + .lede{margin-top:-.75rem}
.chambers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.chambers.one{grid-template-columns:minmax(0,1fr);max-width:720px;margin:1rem 0}
@media (max-width:900px){.chambers{grid-template-columns:minmax(0,1fr)}}
.chamber{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:2px;padding:.9rem 1rem;text-decoration:none;display:grid;gap:.5rem;min-width:0}
.chamber:hover{border-color:var(--ink)}
.ch-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.odds{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-end}
.odds div{display:grid}
.odds b{font-family:var(--f-num);font-size:2rem;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.odds span{font-size:.75rem;color:var(--muted)}
.odds .dem b{color:var(--dem)}.odds .rep{text-align:right}.odds .rep b{color:var(--rep)}.odds .mid{text-align:center}.odds .mid b{font-size:1.2rem;color:var(--ind)}
.seatbar{width:100%;height:auto;display:block}
.seatbar .seg.dem{fill:var(--dem)}.seatbar .seg.dem.lt{fill:var(--dem-lt)}.seatbar .seg.rep{fill:var(--rep)}.seatbar .seg.rep.lt{fill:var(--rep-lt)}
.seatbar .seg.ind{fill:var(--ind)}.seatbar .seg.ind.lt{fill:var(--ind-lt)}.seatbar .seg.tu{fill:var(--tu)}
.seatbar .majline{stroke:var(--ink);stroke-width:2}.seatbar .majtxt{fill:var(--ink);font-family:var(--f-data);font-size:10px}
.ch-sub{font-size:.82rem;color:var(--muted)}.ch-sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.seg-btns{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg-btns .btn{border:0;border-radius:0;font-size:.8rem;padding:.35rem .7rem}
.seg-btns .btn.on{background:var(--ink);color:var(--surface)}
.usmap{position:relative;margin-top:.6rem}
.usmap svg{width:100%;height:auto;display:block}
.usmap .st{stroke:var(--surface);stroke-width:1}
.usmap .st.has{cursor:pointer}.usmap .st.has:hover,.usmap .st.has:focus{stroke:var(--ink);stroke-width:2;outline:none}
.usmap .st.called{stroke:var(--ink);stroke-width:1.6}
.usmap .stlab{font-family:var(--f-data);font-size:11px;font-weight:600;fill:var(--ink);pointer-events:none}
.usmap .stlab.inv{fill:var(--on-strong)}
.usmap .stlab2{font-family:var(--f-data);font-size:11px;fill:var(--ink)}
.maplegend.nat .scale{max-width:200px}
.maplegend .lg-i,.maplegend .lg-n{display:inline-flex;align-items:center;gap:.3rem}
.maplegend .lg-i i,.maplegend .lg-n i{width:12px;height:10px;display:inline-block;border-radius:2px}
table.nat td{vertical-align:middle}
table.nat tr.is-called td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.4rem;vertical-align:.05em}
.pdot.dem{background:var(--dem)}.pdot.rep{background:var(--rep)}.pdot.ind{background:var(--ind)}
.pbar{position:relative;display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--sunk);min-width:90px;flex:1}
.pbar i{display:block;height:100%}.pbar .dem{background:var(--dem)}.pbar .rep{background:var(--rep)}.pbar .ind{background:var(--ind)}
.pbar .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--surface)}
td.pcell{min-width:150px}
td.pcell{display:flex;align-items:center;gap:.5rem}
.chip.called.dem{background:var(--dem);border-color:var(--dem);color:var(--on-strong)}
.chip.called.rep{background:var(--rep);border-color:var(--rep);color:var(--on-strong)}
.chip.called.ind{background:var(--ind);border-color:var(--ind);color:var(--on-strong)}
.hist rect.dem{fill:var(--dem)}.hist rect.rep{fill:var(--rep)}
.chart rect.dem{fill:var(--dem)}.chart rect.rep{fill:var(--rep)}.chart rect.ind{fill:var(--ind)}.chart rect.tu{fill:var(--tu)}
.chart .hl{fill:none;stroke-width:2.5}.chart .hl.sen{stroke:var(--dem)}.chart .hl.hou{stroke:var(--ind)}.chart .hl.gov{stroke:var(--muted);stroke-dasharray:5 3}
.chart .hlab{font-size:11px}.chart .hlab.sen{fill:var(--dem)}.chart .hlab.hou{fill:var(--ind)}
.big .side.sd b{color:var(--dem)}.big .side.sr b{color:var(--rep)}.big .side.si b{color:var(--ind)}.big .side.sr{text-align:right}
.mini-list{display:grid;gap:.4rem;margin-top:.5rem}
.mini-list a{display:grid;grid-template-columns:8rem 1fr;align-items:center;gap:.5rem;text-decoration:none;font-size:.85rem}
.local-rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--a);border-radius:2px;padding:1rem;display:grid;gap:.75rem;max-height:calc(100vh - 90px);overflow:auto}
@media (max-width:1020px){.local-rail{position:static;max-height:none}}
.lr-top h2{font-size:1.2rem;margin:.1rem 0 .25rem}
.lr{display:grid;gap:.3rem;text-decoration:none;padding-top:.6rem;border-top:1px solid var(--rule)}
.lr-h{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-weight:700;font-size:.88rem}
.lr-o{display:flex;justify-content:space-between;gap:.5rem;font-size:.82rem;color:var(--muted)}
.lr-o .lead{color:var(--ink);font-weight:600}
.lr .bar{height:6px}
.foot.scopes{gap:1rem}.foot.scopes b{color:var(--ink);font-weight:600}
.panel h3 + .tbl-wrap{margin-top:.5rem}
.natchart{max-width:760px}
.ch-D{color:var(--dem);font-weight:600}.ch-R{color:var(--rep);font-weight:600}.ch-I{color:var(--ind);font-weight:600}
.st-chip{margin-top:.2rem}.st-chip .chip{font-size:.6rem}
td.pcell .num{min-width:3.4rem;text-align:right}
table.nat{font-size:.84rem}
table.nat td.nmc{white-space:normal;min-width:9rem}
.ch-head .eyebrow{font-size:.62rem}

/* desk */
.desk{display:grid;gap:1rem}
.drop{border:2px dashed var(--rule);border-radius:var(--radius);padding:1.4rem;text-align:center;cursor:pointer;background:var(--sunk)}
.drop.over{border-color:var(--a)}
.field{display:grid;gap:.25rem;font-size:.82rem;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--rule);background:var(--surface);border-radius:4px;padding:.45rem .55rem;width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.75rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:.6rem 1rem;border-radius:4px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
.msg{font-size:.85rem;padding:.6rem .8rem;border-radius:4px;background:var(--sunk)}
.msg.err{color:var(--live)}
.method h3{margin-top:1.25rem}
.method p,.method li{max-width:70ch}
.method code{font-family:var(--f-data);font-size:.85em;background:var(--sunk);padding:.05em .3em;border-radius:3px}
.formula{font-family:var(--f-data);background:var(--sunk);padding:.75rem 1rem;border-radius:4px;overflow-x:auto;font-size:.85rem;white-space:pre}
footer{border-top:1px solid var(--rule);padding-block:1.25rem;font-size:.8rem;color:var(--muted)}

</style>
