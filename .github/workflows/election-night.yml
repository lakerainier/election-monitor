name: Election night (every 3 minutes)

on: workflow_dispatch

permissions:
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Start an update every 3 minutes for about 6 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 115); do
            gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "couldn't start a run; trying again next round"
            sleep 180
          done
